name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 아래 "dist 갱신" 스텝이 되밀어 넣는 커밋으로 워크플로가 다시 돌지 않게 한다
    paths-ignore: ['dist/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ★ 이 단계가 없으면 Pages 소스가 "Deploy from a branch" 로 남아,
      #   deploy-pages 가 성공해도 실제로 서빙되는 건 리포 루트(빌드 전 소스)다.
      #   루트 index.html 은 /src/main.ts 를 참조하므로 브라우저에서 흰 화면이 된다.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # ★ Pages 소스가 아직 "Deploy from a branch (main /root)" 다.
      #   그 모드에서 실제로 서빙되는 것은 워크플로 아티팩트가 아니라 저장소 루트이고,
      #   루트 index.html 은 ./dist/ 로 넘긴다 — 그래서 dist 를 커밋해 둔다.
      #   Pages 소스를 "GitHub Actions" 로 바꾸면 이 스텝과 추적 중인 dist 를 지워도 된다.
      - name: dist 갱신 (브랜치-루트 Pages 모드 대비)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist
          git diff --cached --quiet && echo '변경 없음' && exit 0
          git commit -m 'chore(pages): 빌드 산출물 갱신 [skip ci]'
          git push origin HEAD:main

      # Jekyll 이 산출물을 건드리지 않게 한다 (_ 로 시작하는 경로 무시 방지)
      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
